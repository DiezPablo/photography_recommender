# A qué hora se ve cada especie de España (iNaturalist: altura del sol en cada observación, frente a su grupo) →
# espana_actividad.json, para el factor «activa a esa hora». Semanal; una petición por especie con caché de 25
# días (la primera vez, unos 15 minutos).
name: España actividad

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-recientes
  cancel-in-progress: false

jobs:
  actividad:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - uses: actions/cache/restore@v6
        with:
          path: cache
          key: espana-actividad-v1-${{ github.run_id }}
          restore-keys: espana-actividad-v1-
      - name: Especies de España
        run: gh release download datos -p espana.json -D salida --clobber
      - name: Hora de las observaciones
        run: python -m safari --espana-actividad salida/espana.json --salida salida/espana_actividad.json
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: cache
          key: espana-actividad-v1-${{ github.run_id }}
      - name: Publicar
        run: .github/scripts/publicar_release.sh "España actividad $(date -u +%Y-%m-%d)" salida/espana_actividad.json
