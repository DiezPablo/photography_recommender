# Fauna en España: una descarga SQL de GBIF (recuentos por celda de 10 km, especie, año y mes) → espana.json y el
# informe de viabilidad (docs/espana-viabilidad.md). Trimestral (decisión de la auditoría, 08-11-2026: los datos de
# GBIF cambian poco y cada ejecución son horas de Actions), con descarga nueva; a mano, reutiliza la de la caché salvo
# que se pida otra. Necesita los secretos GBIF_USUARIO y GBIF_CLAVE (sin ellos no hace nada).
name: España

on:
  schedule:
    # el día 1 de enero, abril, julio y octubre
    - cron: "17 3 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      nueva_descarga:
        description: "Pedir otra descarga a GBIF aunque haya una en la caché"
        type: boolean
        default: false
      diagnostico:
        description: "Solo consultas de prueba pequeñas (Gallocanta) para ver qué filtro vacía la descarga"
        type: boolean
        default: false
      experimentos:
        description: "Solo comparar modelos de recomendación con la descarga de la caché (no publica)"
        type: boolean
        default: false
      aceptar_evaluacion:
        description: "Publicar aunque la evaluación empeore más de un 5 % (cambio de algoritmo aceptado a sabiendas)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: espana
  cancel-in-progress: false

jobs:
  espana:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # los secretos (GBIF_USUARIO, GBIF_CLAVE, EBIRD_CLAVE) están en este environment de GitHub
    environment: EBIRD_CLAVE
    env:
      GH_TOKEN: ${{ github.token }}
      GBIF_USUARIO: ${{ secrets.GBIF_USUARIO }}
      GBIF_CLAVE: ${{ secrets.GBIF_CLAVE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - uses: actions/cache/restore@v6
        with:
          path: cache
          key: espana-v1-${{ github.run_id }}
          restore-keys: espana-v1-

      - name: Descarga nueva
        if: ${{ inputs.nueva_descarga || github.event_name == 'schedule' }}
        run: rm -f cache/espana_filas.json.gz

      - name: Diagnóstico
        if: ${{ inputs.diagnostico }}
        run: python -m safari --espana-diagnostico

      - name: Experimentos
        if: ${{ inputs.experimentos }}
        run: |
          python -m safari --espana-experimentos
          [ -s docs/espana-experimentos.json ] && .github/scripts/subir_fichero.sh docs/espana-experimentos.json "Experimentos de España ($(date -u +%Y-%m-%d))" || true

      # para (y no publica) si la evaluación empeora más de un 5 % frente a la línea base (decisión D10)
      - name: GBIF, estacionalidad y evaluación
        if: ${{ !inputs.diagnostico && !inputs.experimentos }}
        env:
          ACEPTAR_EVALUACION: ${{ inputs.aceptar_evaluacion && '1' || '' }}
        run: python -m safari --espana

      - name: Frecuencia de detección de eBird (aves)
        if: ${{ !inputs.diagnostico && !inputs.experimentos }}
        run: |
          [ "${{ inputs.nueva_descarga }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ] && rm -f cache/espana_ebird.json.gz || true
          python -m safari --espana-ebird

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: cache
          key: espana-v1-${{ github.run_id }}

      - name: Informe de viabilidad
        if: ${{ !inputs.experimentos }}
        run: |
          [ -s docs/espana-viabilidad.md ] || { echo "Sin informe (¿faltan los secretos de GBIF?)"; exit 0; }
          # con la API: el commit sale firmado por GitHub (verificado); no hace nada si el informe no cambió
          .github/scripts/subir_fichero.sh docs/espana-viabilidad.md "Viabilidad de España ($(date -u +%Y-%m-%d))"
          # la evaluación de este cálculo y, la primera vez (o al aceptar un cambio), la línea base
          [ -s docs/espana-evaluacion.json ] && .github/scripts/subir_fichero.sh docs/espana-evaluacion.json "Evaluación de España ($(date -u +%Y-%m-%d))" || true
          if [ -s docs/espana-evaluacion-base.json ] && { [ "${{ inputs.aceptar_evaluacion }}" = "true" ] || ! git ls-files --error-unmatch docs/espana-evaluacion-base.json >/dev/null 2>&1; }; then
            [ "${{ inputs.aceptar_evaluacion }}" = "true" ] && cp docs/espana-evaluacion.json /tmp/e.json && python3 -c "import json;json.dump(json.load(open('/tmp/e.json'))['grupos'],open('docs/espana-evaluacion-base.json','w'),indent=1)"
            .github/scripts/subir_fichero.sh docs/espana-evaluacion-base.json "Línea base de la evaluación de España ($(date -u +%Y-%m-%d))"
          fi

      - name: Publicar
        if: ${{ !inputs.experimentos }}
        run: |
          [ -s public/datos/espana_ebird.json ] && .github/scripts/publicar_release.sh "España eBird ($(date -u +%Y-%m-%d))" public/datos/espana_ebird.json || true
          [ -s public/datos/espana.json ] || { echo "Nada que publicar"; exit 0; }
          .github/scripts/publicar_release.sh "España ($(date -u +%Y-%m-%d))" public/datos/espana.json
