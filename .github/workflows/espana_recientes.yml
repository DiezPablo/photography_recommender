# Aves vistas en España en los últimos 30 días (eBird, la última de cada especie por provincia): «última vez
# vista» en /espana. Una vez al día (unas 52 peticiones); sin EBIRD_CLAVE no hace nada.
name: España recientes

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-recientes
  cancel-in-progress: false

jobs:
  recientes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # la clave de eBird está en este environment de GitHub
    environment: EBIRD_CLAVE
    env:
      GH_TOKEN: ${{ github.token }}
      EBIRD_CLAVE: ${{ secrets.EBIRD_CLAVE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: eBird por provincias
        run: python -m safari --espana-recientes --salida salida/espana_recientes.json
      - name: Publicar
        run: .github/scripts/publicar_release.sh "España recientes $(date -u +%Y-%m-%dT%H:%MZ)" salida/espana_recientes.json
