# Modo Luz. Previsión para todos los spots de España, dos veces al día (madrugada, con los modelos de la noche,
# y mediodía, para decidir el atardecer). Los datos van a la release "datos" y Vercel reconstruye la
# web. Calcula también el calendario de eventos (eventos.json).
# Dos ejecuciones al día para no pasar del límite gratuito de Open-Meteo (10 000 llamadas/día): una en cada ventana.
# GitHub retrasa los cron de 7 a 9 horas (11-2026): se programa cada hora y el paso «cuando» deja seguir solo la
# primera que cae en una ventana (decisión 0024).
name: Luz · previsión

on:
  schedule:
    - cron: "47 * * * *" # cada hora; «cuando» decide
  workflow_dispatch:
    inputs:
      forzar:
        description: "Correr aunque ya haya dos previsiones con éxito hoy (gasta cupo de Open-Meteo)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - rasante/prevision/**
      - rasante/notas/**
      - rasante/cielo/**
      - rasante/terreno/**
      - rasante/comun/**
      - rasante/eventos/**
      - rasante/lugares/**
      - rasante/recursos/lugar.schema.json
      - rasante/verificacion/**
      - rasante/recursos/eventos_naturaleza.csv
      - mis_spots.csv
      - .github/workflows/luz_datos.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: publicar-datos
  cancel-in-progress: false

jobs:
  # GitHub retrasa los cron horas: se programa cada hora y aquí se decide si toca (decisión 0024)
  cuando:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      toca: ${{ steps.toca.outputs.toca }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: toca
        # de 4 a 7 (antes del amanecer, con los modelos de la noche) y de 12 a 16 (para el atardecer), hora peninsular
        env:
          FORZAR: ${{ inputs.forzar }}
        # y como mucho dos previsiones con éxito al día, vengan de donde vengan (cupo de Open-Meteo, spec 024)
        run: python3 .github/scripts/toca.py luz_datos.yml "4-7,12-16" --maximo 2

  datos:
    needs: cuando
    if: needs.cuando.outputs.toca == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # una espera al límite por hora de Open-Meteo cabe (rasante.prevision.openmeteo.espera_limite)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - uses: actions/cache@v6
        with:
          path: cache/lp
          key: atlas-lp-2025

      # La primera vez, los datos que no se recalculan a diario vienen de la release del repositorio anterior
      - name: Siembra (solo si faltan en la release)
        run: .github/scripts/sembrar.sh spots.geojson clima.json dron.json verificacion.json

      - name: Spots publicados
        run: |
          mkdir -p public/datos
          # recién sembrados, la release puede tardar unos segundos en servirlos (404): vale la copia local
          if curl -fsSL https://github.com/${{ github.repository }}/releases/download/datos/spots.geojson.gz \
              | gunzip > /tmp/spots.geojson; then
            mv /tmp/spots.geojson public/datos/spots.geojson
          elif [ -s salida/siembra/spots.geojson ]; then
            cp salida/siembra/spots.geojson public/datos/spots.geojson
            echo "Spots de la siembra de esta misma ejecución"
          else
            echo "Sin spots en la release: se usan los del repositorio"
          fi

      - name: Calcular condiciones
        run: |
          mkdir -p salida
          python -m rasante prevision --salida salida/informe.json

      - name: Calendario de eventos
        run: python -m rasante eventos --salida salida/eventos.json

      # Índice común de los dos catálogos (spec 003): los spots de aquí y los lugares de fauna de la release.
      # Si falla, la previsión se publica igual y queda el lugares.json anterior.
      - name: Lugares
        continue-on-error: true
        run: |
          for f in fauna_lugares.json fauna_natura.json acceso.json; do
            .github/scripts/bajar_dato.sh "$f" "public/datos/$f"
          done
          python -m rasante lugares --salida salida/lugares.json

      # Lo previsto para los aeropuertos frente a lo observado (METAR): el historial vive en la release
      # nunca bloquea la publicación de la previsión: si falla, esa vez no se publica la verificación
      - name: Verificación
        continue-on-error: true
        run: |
          if curl -fsSL -o /tmp/verificacion.json.gz \
              https://github.com/${{ github.repository }}/releases/download/datos/verificacion.json.gz; then
            gunzip -c /tmp/verificacion.json.gz > salida/verificacion.json
          else
            echo "Sin historial: se empieza de cero"
          fi
          python -m rasante verificar --historial salida/verificacion.json

      - name: Publicar
        run: |
          # si mientras tanto el descubrimiento publicó otro catálogo, la previsión y el índice de esta ejecución
          # son del anterior: no se publican (la siguiente previsión los hace con el nuevo; spec 024, punto 4)
          mismo_catalogo=si
          if curl -fsSL https://github.com/${{ github.repository }}/releases/download/datos/spots.geojson.gz \
              | gunzip > /tmp/spots_ahora.geojson; then
            python3 .github/scripts/mismos_spots.py public/datos/spots.geojson /tmp/spots_ahora.geojson || mismo_catalogo=no
          fi
          # publicar_release.sh no publica nada si falta un fichero: la lista lleva solo los que existen
          ficheros=""
          [ "$mismo_catalogo" = si ] && ficheros="salida/informe.json"
          for f in salida/eventos.json salida/verificacion.json; do
            [ -s "$f" ] && ficheros="$ficheros $f"
          done
          [ "$mismo_catalogo" = si ] && [ -s salida/lugares.json ] && ficheros="$ficheros salida/lugares.json"
          [ -n "$ficheros" ] || { echo "Nada que publicar"; exit 0; }
          .github/scripts/publicar_release.sh "Datos $(date -u +%Y-%m-%dT%H:%MZ)" $ficheros
