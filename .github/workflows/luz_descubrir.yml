# Busca los spots de toda España (Wikidata + OpenStreetMap + popularidad en Commons), calcula el
# horizonte del terreno de cada uno y publica spots.geojson e informe.json en la release "datos".
# El primer cálculo es largo (~13 000 peticiones a Commons): la caché se guarda entre ejecuciones y,
# si se agota el tiempo, la siguiente continúa.
name: Luz · descubrir spots

# Mensual (spec 018). Mientras la caché de Commons no tenga contada la popularidad de casi todos los candidatos
# (rasante.spots.cli.MIN_CONTADOS), la ejecución solo la rellena y no publica: un catálogo a medias sería peor
# que el publicado. Para llenarla antes, lánzalo a mano las veces que haga falta (cada vez sigue donde lo dejó).
on:
  schedule:
    - cron: "37 2 3 * *"
  workflow_dispatch:
    inputs:
      total:
        description: "Número de spots"
        default: "1500"
      por_provincia:
        description: "Mínimo de spots por provincia"
        default: "20"
      minutos:
        description: "Tiempo máximo para consultar Commons (min)"
        default: "150"

permissions:
  contents: write

# Cola propia: el descubrimiento dura horas y no debe frenar las previsiones diarias (datos.yml).
# Publicar a la vez no rompe nada: cada publicación parte del último main y sube sus ficheros.
concurrency:
  group: descubrir
  cancel-in-progress: false

jobs:
  descubrir:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      # Respuestas de Commons, Wikidata y Overpass, teselas del terreno y del atlas: entre ejecuciones.
      # Se guardan aunque el trabajo falle o se corte, para no repetir horas de peticiones.
      - uses: actions/cache/restore@v6
        with:
          path: cache
          key: descubrir-${{ github.run_id }}
          restore-keys: descubrir-

      - name: Buscar spots
        run: |
          python -m rasante spots --salida salida \
            --total "${{ inputs.total || '1500' }}" \
            --por-provincia "${{ inputs.por_provincia || '20' }}" \
            --minutos "${{ inputs.minutos || '150' }}"

      # sin la popularidad completa, aquí se para: la caché queda guardada y la siguiente ejecución sigue
      - name: ¿Catálogo completo?
        id: completo
        run: |
          if [ -f salida/INCOMPLETO ]; then
            echo "Popularidad contada en el $(cat salida/INCOMPLETO): se rellena la caché, no se publica"
            echo "si=false" >> "$GITHUB_OUTPUT"
          else
            echo "si=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Previsión con los spots nuevos
        if: steps.completo.outputs.si == 'true'
        run: python -m rasante prevision --spots salida/spots.geojson --salida salida/informe.json

      # ¿Se puede volar un dron en cada spot? (ENAIRE y espacios protegidos). Si no responden, queda el anterior.
      - name: Dron
        if: steps.completo.outputs.si == 'true'
        continue-on-error: true
        run: python -m rasante dron --spots salida/spots.geojson --salida salida/dron.json

      - uses: actions/upload-artifact@v7
        with:
          name: spots
          path: salida/spots.*
          retention-days: 14

      - name: Publicar
        if: steps.completo.outputs.si == 'true'
        run: |
          .github/scripts/publicar_release.sh "Actualizar spots ($(date -u +%Y-%m-%d))" \
            salida/spots.geojson salida/spots.csv salida/informe.json
          [ -s salida/dron.json ] && .github/scripts/publicar_release.sh "Dron ($(date -u +%Y-%m-%d))" salida/dron.json || true

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: cache
          key: descubrir-${{ github.run_id }}
