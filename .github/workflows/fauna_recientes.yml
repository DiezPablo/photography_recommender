# Lugares de fauna en España (fauna_lugares.json) y aves vistas en los últimos 30 días (eBird, la última de cada especie por provincia): «última vez
# vista» en /fauna. Una vez al día (unas 52 peticiones); sin EBIRD_CLAVE no hace nada.
name: Fauna · recientes

on:
  schedule:
    - cron: "23 * * * *" # cada hora; «cuando» decide (GitHub retrasa los cron horas, decisión 0024)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publicar-recientes
  cancel-in-progress: false

jobs:
  # GitHub retrasa los cron horas: se programa cada hora y aquí se decide si toca (decisión 0024)
  cuando:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      toca: ${{ steps.toca.outputs.toca }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: toca
        # una vez al día, entre las 5 y las 12 hora peninsular
        run: python3 .github/scripts/toca.py fauna_recientes.yml "5-12"

  recientes:
    needs: cuando
    if: needs.cuando.outputs.toca == 'true'
    runs-on: ubuntu-24.04
    # la ejecución completa ronda los 14 min mientras se rellena el histórico de listas (5 días por vez)
    timeout-minutes: 30
    # la clave de eBird está en este environment de GitHub
    environment: EBIRD_CLAVE
    env:
      GH_TOKEN: ${{ github.token }}
      EBIRD_CLAVE: ${{ secrets.EBIRD_CLAVE }}
      # las órdenes de eBird de esta ejecución comparten la cuenta de peticiones (≤ 500 al día, spec 021)
      EBIRD_CONTADOR: salida/ebird_peticiones.txt
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: eBird por provincias
        run: python -m rasante fauna recientes --salida salida/fauna_recientes.json
      - name: Lugares (puntos de eBird, espacios protegidos de Wikidata, observatorios de OSM, Natura 2000)
        run: python -m rasante fauna lugares --salida salida/fauna_lugares.json
      # Listas de eBird por punto (spec 021): el recuento por día vive en la release y cada día se añade el anterior
      - name: Actividad de eBird por punto
        continue-on-error: true
        run: |
          .github/scripts/bajar_dato.sh fauna_listas_dias.json salida/fauna_listas_dias.json
          python -m rasante fauna listas --salida salida/fauna_listas.json
      # Bloques 2 y 3 de la spec 021: actividad por región (30 días) y especies de cada punto (por tandas). Los
      # ficheros publicados hacen de historial y de caché; lo que no quepa en el presupuesto del día, mañana.
      - name: Actividad por región y especies por punto (eBird)
        continue-on-error: true
        run: |
          for f in fauna_ebird_regiones fauna_especies_punto; do
            .github/scripts/bajar_dato.sh $f.json salida/$f.json
          done
          python -m rasante fauna regiones --salida salida/fauna_ebird_regiones.json
          python -m rasante fauna especies --salida salida/fauna_especies_punto.json
          echo "Peticiones a eBird hoy: $(cat salida/ebird_peticiones.txt 2>/dev/null || echo 0)"
      - name: Publicar
        run: |
          .github/scripts/publicar_release.sh "Fauna recientes $(date -u +%Y-%m-%dT%H:%MZ)" salida/fauna_recientes.json
          [ -s salida/fauna_rarezas.json ] && .github/scripts/publicar_release.sh "Fauna rarezas $(date -u +%Y-%m-%d)" salida/fauna_rarezas.json || true
          [ -s salida/fauna_lugares.json ] && .github/scripts/publicar_release.sh "Fauna lugares $(date -u +%Y-%m-%d)" salida/fauna_lugares.json || true
          [ -s salida/fauna_listas.json ] && .github/scripts/publicar_release.sh "Fauna listas de eBird $(date -u +%Y-%m-%d)" salida/fauna_listas.json salida/fauna_listas_dias.json || true
          [ -s salida/fauna_ebird_regiones.json ] && .github/scripts/publicar_release.sh "eBird por región $(date -u +%Y-%m-%d)" salida/fauna_ebird_regiones.json || true
          [ -s salida/fauna_especies_punto.json ] && .github/scripts/publicar_release.sh "eBird especies por punto $(date -u +%Y-%m-%d)" salida/fauna_especies_punto.json || true
          [ -s salida/fauna_natura.json ] && .github/scripts/publicar_release.sh "Fauna Natura 2000 $(date -u +%Y-%m-%d)" salida/fauna_natura.json || true
